apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-git
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-git
  template:
    metadata:
      labels:
        app: gestion-git
    spec:
      containers:
        - name: gestion-git
          image: rahmaaloui/devmedic-gestion-git:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-app:5432/devmedic"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devmedic-secrets
                  key: POSTGRES_APP_PASSWORD
            - name: SONAR_URL
              value: "http://sonarqube:9000"
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devmedic-secrets
                  key: SONAR_TOKEN
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-git
spec:
  type: LoadBalancer
  selector:
    app: gestion-git
  ports:
    - port: 8082
      targetPort: 8082